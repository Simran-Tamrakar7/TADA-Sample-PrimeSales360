<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Portal</title>
<link rel="stylesheet" href="style.css">
<style>
/* Tab styling */
.tab-menu {
  display: flex;
  background: #eee;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 20px;
}
.tab-menu button {
  flex: 1;
  padding: 12px;
  border: none;
  cursor: pointer;
  background: #ddd;
  font-weight: bold;
}
.tab-menu button.active { background: #4CAF50; color: #fff; }
.tab-content { width: 100%; height: 80vh; border: none; border-radius: 10px; }
</style>
</head>
<body>
<div class="container">
  <h2>Travel Portal</h2>

  <div class="tab-menu">
    <button class="tab-btn active" data-page="apply.html">Apply</button>
    <button class="tab-btn" data-page="status.html">Approval / Status</button>
    <button class="tab-btn" data-page="post.html">Post-Travel</button>
  </div>

  <iframe id="tabFrame" class="tab-content" src="apply.html"></iframe>
</div>

<script>
const buttons = document.querySelectorAll('.tab-btn');
const iframe = document.getElementById('tabFrame');

buttons.forEach(btn => {
  btn.addEventListener('click', ()=>{
    buttons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    iframe.src = btn.dataset.page; // load selected HTML
  });
});
</script>
</body>
</html>
