<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post-Travel Settlements</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #333;
    }

    .card {
      background: #fff;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 6px;
      color: #fff;
      position: absolute;
      top: 15px;
      right: 15px;
      font-weight: bold;
    }

    .status-Pending {
      background: #ffc107;
    }

    .status-Approved {
      background: #4caf50;
    }

    .status-SettleCompleted {
      background: #4caf50;
    }

    .settleBtn {
      background: #2196f3;
      color: #fff;
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    .settleBtn:hover {
      background: #1976d2;
    }
  </style>
</head>

<body>
  <h2>Post-Travel Settlements</h2>
  <div id="settlementList"></div>

  <script>
    // Load all travel requests from localStorage
    let travelRequests = JSON.parse(
      localStorage.getItem("travelRequests") || "[]",
    );

    // Filter only Approved travels that are not settled yet
    let pendingSettlements = travelRequests.filter(
      (t) => t.status === "Approved" && !t.settled,
    );

    function renderSettlements() {
      const list = document.getElementById("settlementList");
      list.innerHTML = "";

      if (pendingSettlements.length === 0) {
        list.innerHTML = "<p>No pending settlements.</p>";
        return;
      }

      pendingSettlements.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "card";

        const totalExpense = Object.values(t.plannedExpenses || {}).reduce(
          (a, b) => a + b,
          0,
        );

        div.innerHTML = `
      <h3>${t.travelType}</h3>
      <p>${t.fromDate} → ${t.toDate} (${t.totalDays} days)</p>
      <p>Total Planned Expense: Rs ${totalExpense}</p>
      <span class="status-badge status-${t.status}">${t.status}</span>
    `;

        // Proceed to Settle button
        const btn = document.createElement("button");
        btn.textContent = "Proceed to Settle";
        btn.className = "settleBtn";
        btn.onclick = (e) => {
          e.stopPropagation();
          // Save the travel to localStorage to prefill postsettlement.html
          localStorage.setItem("settleTravel", JSON.stringify(t));
          window.location.href = "postsettlement.html";
        };
        div.appendChild(btn);

        list.appendChild(div);
      });
    }

    // Initial render
    renderSettlements();
  </script>
</body>

</html>
