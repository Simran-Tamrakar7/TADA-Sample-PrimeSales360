<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel & Reimbursement Portal</title>
  <style>
    .tab-bar {
      display: flex;
      overflow-x: auto;
      background: #f0f0f0;
      border-bottom: 2px solid #ddd;
    }

    .tab-bar button {
      flex: 1;
      min-width: 100px;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #ddd;
      font-weight: bold;
      position: relative;
    }

    .tab-bar button.active {
      background: #4CAF50;
      color: #fff;
    }

    .tab-bar button .badge {
      position: absolute;
      top: 5px;
      right: 10px;
      background: #f44336;
      color: #fff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 50%;
    }

    .breadcrumb {
      padding: 10px 20px;
      font-size: 14px;
      background: #fafafa;
      border-bottom: 1px solid #ddd;
    }

    #tabContent {
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="breadcrumb">☰ > Live Section > Travel & Re-Imbursements > <span id="currentScreen">Dashboard</span></div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="dashboard">Dashboard <span class="badge"
        id="dashboardBadge">2</span></button>
    <button class="tab-btn" data-tab="travel">Travel</button>
    <button class="tab-btn" data-tab="expenses">Expenses</button>
    <button class="tab-btn" data-tab="advance">Advance</button>
    <button class="tab-btn" data-tab="settle">Settle</button>
    <button class="tab-btn" data-tab="approval">Approval</button>
    <button class="tab-btn" data-tab="more">More</button>
  </div>

  <div id="tabContent"></div>

  <script>
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContent = document.getElementById('tabContent');
    const currentScreen = document.getElementById('currentScreen');

    // Optional: hide FAB for certain tabs (not implemented here)
    const fabActions = { dashboard: '+', travel: '+', expenses: '+', advance: '+', settle: '+', approval: '', more: '' };

    function loadTab(tab, subview = '') {
      // determine iframe source
      let iframeSrc = '';
      switch (tab) {
        case 'dashboard': iframeSrc = 'dashboard.html'; break;
        case 'travel': iframeSrc = 'travel-apply.html'; break;
        case 'expenses': iframeSrc = 'expenses.html'; break;
        case 'advance': iframeSrc = 'advance.html'; break;
        case 'settle': iframeSrc = 'postsettlement.html'; break;
        case 'approval': iframeSrc = 'approval.html'; break;
        case 'more': iframeSrc = 'more.html'; break;
      }

      tabContent.innerHTML = `<iframe id="tabIframe" src="${iframeSrc}" style="width:100%;height:80vh;border:none;"></iframe>`;
      currentScreen.textContent = tab.charAt(0).toUpperCase() + tab.slice(1);

      // highlight active tab
      tabButtons.forEach(b => b.classList.remove('active'));
      document.querySelector(`.tab-btn[data-tab="${tab}"]`)?.classList.add('active');

      // wait for iframe load to trigger subview
      const iframe = document.getElementById('tabIframe');
      iframe.onload = () => {
        if (subview && iframe.contentWindow) {
          if (subview === 'apply' && typeof iframe.contentWindow.openForm === 'function') {
            iframe.contentWindow.openForm();
          }
          if (subview === 'addExpense' && typeof iframe.contentWindow.openForm === 'function') {
            iframe.contentWindow.openForm();
          }
        }
      };
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => loadTab(btn.dataset.tab));
    });

    // default load dashboard
    loadTab('dashboard');

    window.loadTab = loadTab; // make it globally accessible
  </script>
</body>

</html>
