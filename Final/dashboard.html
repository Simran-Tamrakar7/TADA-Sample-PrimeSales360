<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Overview</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  margin:0;
}

.container {
  width:95%;
  max-width:1200px;
  margin:30px auto;
  background:#fff;
  padding:25px;
  border-radius:10px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2 { margin-bottom:20px; }

.module-section { margin-bottom:30px; }

.module-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.counter {
  background:#4CAF50;
  color:#fff;
  border-radius:50%;
  padding:4px 8px;
  font-size:12px;
}

.accordion {
  margin-bottom:10px;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.accordion-header {
  background:#eee;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}

.accordion-body {
  max-height:0;
  overflow:hidden;
  transition:max-height 0.3s ease;
  background:#fafafa;
}

.card {
  padding:10px 15px;
  border-bottom:1px solid #ddd;
}

.card:last-child { border-bottom:none; }

.status-pending { color:#FFA500; }
.status-approved { color:#4CAF50; }
.status-rejected { color:#f44336; }
</style>
</head>

<body>

<div class="container">
  <h2>Dashboard Status</h2>
  <div id="dashboardContent"></div>
</div>

<script>
/* ===== MODULES ===== */
const modules = [
  'Travel Requests',
  'Expenses',
  'Post-Travel Settlements',
  'Advance Requests'
];

/* ===== DATA FETCH ===== */
function getModuleData(name){
  switch(name){
    case 'Travel Requests':
      return JSON.parse(localStorage.getItem('travelRequests') || '[]');
    case 'Expenses':
      return JSON.parse(localStorage.getItem('addedExpenses') || '[]');
    case 'Post-Travel Settlements':
      return JSON.parse(localStorage.getItem('postSettlements') || '[]');
    case 'Advance Requests':
      return JSON.parse(localStorage.getItem('advanceRequests') || '[]');
    default:
      return [];
  }
}

/* ===== RENDER MODULE ===== */
function renderModule(name){
  const data = getModuleData(name).map(d => ({
    ...d,
    status: d.status || 'Pending'
  }));

  const pending = data.filter(d => d.status === 'Pending');
  const approved = data.filter(d => d.status === 'Approved');
  const rejected = data.filter(d => d.status === 'Rejected');

  const renderAccordion = (title, items, cls) => `
    <div class="accordion">
      <div class="accordion-header">${title} (${items.length})</div>
      <div class="accordion-body">
        ${items.map(item => `
          <div class="card">
            ${Object.entries(item).map(([k,v]) =>
              `<div>${k}: <span class="status-${cls}">${v}</span></div>`
            ).join('')}
          </div>
        `).join('')}
      </div>
    </div>
  `;

  return `
    <div class="module-section">
      <div class="module-header">
        <h3>${name}</h3>
        <span class="counter">${data.length}</span>
      </div>
      ${renderAccordion('Pending', pending, 'pending')}
      ${renderAccordion('Approved', approved, 'approved')}
      ${renderAccordion('Rejected', rejected, 'rejected')}
    </div>
  `;
}

/* ===== RENDER DASHBOARD ===== */
function renderDashboard(){
  const container = document.getElementById('dashboardContent');
  container.innerHTML = modules.map(renderModule).join('');

  document.querySelectorAll('.accordion-header').forEach(header=>{
    header.onclick = () => {
      const body = header.nextElementSibling;
      body.style.maxHeight =
        body.style.maxHeight && body.style.maxHeight !== '0px'
          ? '0px'
          : body.scrollHeight + 'px';
    };
  });
}

/* ===== INIT ===== */
renderDashboard();

/* Auto-refresh if approval page updates data */
window.addEventListener('storage', renderDashboard);
</script>

</body>
</html>
