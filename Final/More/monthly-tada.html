<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly TADA Report (Mock Data)</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
}
.container {
  max-width: 1100px;
  margin: 20px auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}
tfoot td {
  font-weight: bold;
}
.yellow { background: #fff7cc; }
.green { background: #c8e6c9; }
.red { background: #ffcdd2; }
select {
  padding: 6px;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h2>Monthly TADA Report</h2>
    <div>
      <select id="year"></select>
      <select id="month"></select>
      <button onclick="generate()">Generate</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Day</th>
        <th>Visit</th>
        <th>Total (Rs.)</th>
        <th>Remarks</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
    <tfoot>
      <tr>
        <td colspan="3">Total Amount</td>
        <td class="yellow" id="total">0</td>
        <td></td>
      </tr>
      <tr>
        <td colspan="3">Approved</td>
        <td class="green" id="approved">0</td>
        <td></td>
      </tr>
      <tr>
        <td colspan="3">Rejected</td>
        <td class="red" id="rejected">0</td>
        <td></td>
      </tr>
    </tfoot>
  </table>
</div>

<script>
const yearSel = document.getElementById('year');
const monthSel = document.getElementById('month');

const daysName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

(function init() {
  const y = new Date().getFullYear();
  for (let i = y - 3; i <= y + 1; i++) {
    yearSel.innerHTML += `<option value="${i}">${i}</option>`;
  }

  const months = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];
  months.forEach((m,i)=>{
    monthSel.innerHTML += `<option value="${i}">${m}</option>`;
  });
})();

function generate() {
  const year = +yearSel.value;
  const month = +monthSel.value;
  const tbody = document.getElementById('body');
  tbody.innerHTML = '';

  let total = 0, approved = 0, rejected = 0;

  const date = new Date(year, month, 1);
  while (date.getMonth() === month) {
    const day = date.getDay();
    let visit = 1;
    let amount = 0;
    let remark = 'P';

    // Saturday = Holiday
    if (day === 6) {
      visit = 0;
      remark = 'H';
    }
    // Random leave
    else if (Math.random() < 0.08) {
      visit = 0;
      remark = 'L';
    }
    // Random rejected
    else if (Math.random() < 0.05) {
      amount = 315;
      remark = 'R';
      rejected += amount;
    }
    // Normal working day
    else {
      amount = Math.random() < 0.6 ? 315 : 0;
      approved += amount;
    }

    total += amount;

    tbody.innerHTML += `
      <tr>
        <td>${date.toISOString().split('T')[0]}</td>
        <td>${daysName[day]}</td>
        <td>${visit}</td>
        <td>${amount}</td>
        <td>${remark}</td>
      </tr>
    `;

    date.setDate(date.getDate() + 1);
  }

  document.getElementById('total').innerText = total;
  document.getElementById('approved').innerText = approved;
  document.getElementById('rejected').innerText = rejected;
}
</script>

</body>
</html>
