<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel & Reimbursement Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f9f9f9;
    }

    .tab-bar {
      display: flex;
      overflow-x: auto;
      background: #f0f0f0;
      border-bottom: 2px solid #ddd;
    }

    .tab-bar button {
      flex: 1;
      min-width: 100px;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #ddd;
      font-weight: bold;
      position: relative;
    }

    .tab-bar button.active {
      background: #4CAF50;
      color: #fff;
    }

    .tab-bar button .badge {
      position: absolute;
      top: 5px;
      right: 10px;
      background: #f44336;
      color: #fff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 50%;
    }

    .breadcrumb {
      padding: 10px 20px;
      font-size: 14px;
      background: #fafafa;
      border-bottom: 1px solid #ddd;
    }

    #tabContent {
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }
  </style>
</head>

<body>

  <div class="breadcrumb">☰ > Live Section > Travel & Re-Imbursements > <span id="currentScreen">Dashboard</span></div>

  <div class="tab-bar">
    <button class="tab-btn" data-tab="dashboard" data-roles="SESO,ACM,FINANCE">
      Dashboard <span class="badge" id="dashboardBadge">2</span>
    </button>
    <button class="tab-btn" data-tab="travel" data-roles="SESO,ACM">Travel</button>
    <button class="tab-btn" data-tab="advance" data-roles="FINANCE">Advance</button>
    <button class="tab-btn" data-tab="settle" data-roles="FINANCE">Settle</button>
    <button class="tab-btn" data-tab="approval" data-roles="ACM">Approval</button>
    <button class="tab-btn" data-tab="more" data-roles="SESO,ACM">More</button>
  </div>

  <div id="tabContent"></div>

  <script>
    // --- Load user from localStorage ---
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (!user) {
      window.location.href = "login.html"; // redirect to login if not logged in
    }
    const userRole = user.role;

    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabContent = document.getElementById("tabContent");
    const currentScreen = document.getElementById("currentScreen");

    let firstVisibleTab = null;

    // --- Role-based tab filtering ---
    tabButtons.forEach(btn => {
      const allowedRoles = btn.dataset.roles.split(",");
      if (!allowedRoles.includes(userRole)) {
        btn.style.display = "none"; // hide tab if role not allowed
      } else if (!firstVisibleTab) {
        firstVisibleTab = btn.dataset.tab; // first tab for default load
      }
    });

    // --- Load tab function with safety ---
    function loadTab(tab, subview = '') {
      const button = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
      if (!button || button.style.display === "none") return; // prevent unauthorized access

      // Determine iframe source
      let iframeSrc = '';
      switch (tab) {
        case 'dashboard': iframeSrc = 'dashboard.html'; break;
        case 'travel': iframeSrc = 'travel-apply.html'; break;
        case 'advance': iframeSrc = 'advance.html'; break;
        case 'settle': iframeSrc = 'post.html'; break;
        case 'approval': iframeSrc = 'approval.html'; break;
        case 'more': iframeSrc = 'more.html'; break;
      }

      tabContent.innerHTML = `<iframe id="tabIframe" src="${iframeSrc}"></iframe>`;
      currentScreen.textContent = tab.charAt(0).toUpperCase() + tab.slice(1);

      // Highlight active tab
      tabButtons.forEach(b => b.classList.remove('active'));
      button.classList.add('active');

      // Optional: trigger subview function in iframe
      const iframe = document.getElementById('tabIframe');
      iframe.onload = () => {
        if (subview && iframe.contentWindow && typeof iframe.contentWindow.openForm === 'function') {
          iframe.contentWindow.openForm();
        }
      };
    }

    // --- Attach click events to tabs ---
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => loadTab(btn.dataset.tab));
    });

    // --- Load first allowed tab automatically ---
    if (firstVisibleTab) {
      loadTab(firstVisibleTab);
    }
  </script>
</body>

</html>
