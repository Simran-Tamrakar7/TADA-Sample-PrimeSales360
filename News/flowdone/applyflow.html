<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Requests</title>

<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; }
h2,h3 { color:#333; }
label { display:block; margin:8px 0 3px; font-weight:bold; }
input,select,textarea {
  width:100%; padding:8px; margin-bottom:10px;
  border-radius:5px; border:1px solid #ccc;
}
input[readonly], select[disabled] { background:#eee; }

button {
  padding:10px 25px; background:#4CAF50; color:#fff;
  border:none; border-radius:6px; cursor:pointer;
}
button:disabled { background:#aaa; cursor:not-allowed; }

.card {
  background:#fff; padding:15px; margin:15px;
  border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.1);
  cursor:pointer;
}

.fab {
  position:fixed; bottom:25px; right:25px;
  width:60px; height:60px; border-radius:50%;
  font-size:32px; background:#4CAF50; color:#fff;
  border:none;
}

.hidden { display:none; }

.modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.5);
  justify-content:center; align-items:center;
}

.modal-content {
  background:#fff; padding:20px;
  border-radius:10px; width:90%;
  max-width:650px; max-height:90%;
  overflow-y:auto;
}

.status-badge {
  padding:4px 8px; border-radius:6px; color:#fff;
}
.status-Pending { background:#ffc107; }
.status-Approved { background:#4CAF50; }
.status-Rejected { background:#f44336; }
</style>
</head>

<body>

<div style="display:flex;justify-content:space-between;align-items:center;padding:15px;">
  <h2>My Travel Requests</h2>
  <button id="filterBtn">Filter</button>
</div>

<div id="travelList"></div>

<button class="fab" id="addBtn">+</button>

<!-- MODAL -->
<div id="formModal" class="modal">
  <div class="modal-content">
    <h3 id="formTitle">New Travel</h3>

    <!-- Employee Info -->
    <section>
      <h3>Employee Information</h3>
      <label>Employee ID</label><input readonly placeholder="Auto">
      <label>Employee Name</label><input readonly placeholder="Auto">
      <label>Department</label><input readonly placeholder="Auto">
    </section>

    <!-- Travel Details -->
    <section>
      <h3>Travel Details</h3>
      <label>Travel Type</label>
      <select id="travelType">
        <option>Select Travel Type</option>
        <option>Local Travel</option>
        <option>Upcountry Travel</option>
        <option>Transit Market Travel</option>
        <option>International Travel</option>
        <option>Emergency Travel</option>
        <option>Training / Conference Travel</option>
        <option>Project-Based Travel</option>
      </select>

      <label>Purpose</label>
      <textarea id="purpose"></textarea>
    </section>

    <!-- Duration -->
    <section>
      <h3>Travel Duration</h3>
      <label>From Date</label><input type="date" id="fromDate">
      <label>To Date</label><input type="date" id="toDate">
      <label>Total Days</label><input id="totalDays" readonly>
    </section>

    <!-- Expenses -->
    <section id="expensesSection" class="hidden">
      <h3>Estimated Expenses</h3>
      <label>Transport</label><input id="transport">
      <label>TADA</label><input id="tada" readonly>
      <label>Vehicle</label><input id="vehicle">
      <label>Guest</label><input id="guest">
      <label>Team</label><input id="team">
      <label>Other</label><input id="other">
    </section>

    <!-- Advance -->
    <section id="advanceSection" class="hidden">
      <h3>Advance</h3>
      <label>Advance Required</label>
      <select id="advanceRequired">
        <option>No</option>
        <option>Yes</option>
      </select>

      <div id="advanceFields" class="hidden">
        <label>Advance Amount</label><input id="advanceAmount" type="number">
        <label>Eligibility</label><input id="eligibility" readonly>
      </div>
    </section>

    <div style="text-align:right;">
      <button id="submitBtn" type="button">Submit</button>
      <button id="closeBtn" style="background:#ccc;color:#000;">Cancel</button>
    </div>
  </div>
</div>

<script>
let travelRequests = JSON.parse(localStorage.getItem('travelRequests')||'[]');
let editingIndex = null;

const list = document.getElementById('travelList');
const modal = document.getElementById('formModal');
const submitBtn = document.getElementById('submitBtn');

const travelType = document.getElementById('travelType');
const purpose = document.getElementById('purpose');
const fromDate = document.getElementById('fromDate');
const toDate = document.getElementById('toDate');
const totalDays = document.getElementById('totalDays');

const expensesSection = document.getElementById('expensesSection');
const advanceSection = document.getElementById('advanceSection');
const advanceRequired = document.getElementById('advanceRequired');
const advanceFields = document.getElementById('advanceFields');

const transport = document.getElementById('transport');
const tada = document.getElementById('tada');
const vehicle = document.getElementById('vehicle');
const guest = document.getElementById('guest');
const team = document.getElementById('team');
const other = document.getElementById('other');
const advanceAmount = document.getElementById('advanceAmount');
const eligibility = document.getElementById('eligibility');

function calculateDays(){
  if(fromDate.value && toDate.value){
    const d = (new Date(toDate.value)-new Date(fromDate.value))/(86400000)+1;
    totalDays.value = d>0?d:0;
    tada.value = totalDays.value * 1000;
  }
}

fromDate.onchange = toDate.onchange = calculateDays;

travelType.onchange = ()=>{
  const show = ['Upcountry Travel','International Travel','Project-Based Travel']
    .includes(travelType.value);
  expensesSection.classList.toggle('hidden',!show);
  advanceSection.classList.toggle('hidden',!show);
};

advanceRequired.onchange = ()=>{
  advanceFields.classList.toggle('hidden',advanceRequired.value!=='Yes');
  eligibility.value = advanceRequired.value==='Yes'?'Eligible':'';
};

function openForm(i=null){
  editingIndex = i;
  modal.style.display='flex';

  if(i!==null){
    const t = travelRequests[i];
    travelType.value=t.travelType;
    purpose.value=t.purpose;
    fromDate.value=t.fromDate;
    toDate.value=t.toDate;
    totalDays.value=t.totalDays;
    transport.value=t.plannedExpenses.transport;
    tada.value=t.plannedExpenses.tada;
    vehicle.value=t.plannedExpenses.vehicle;
    guest.value=t.plannedExpenses.guest;
    team.value=t.plannedExpenses.team;
    other.value=t.plannedExpenses.other;
    advanceRequired.value=t.advanceTaken>0?'Yes':'No';
    advanceAmount.value=t.advanceTaken;
  }else{
    document.querySelectorAll('input,textarea').forEach(i=>i.value='');
    travelType.value='Select Travel Type';
    advanceRequired.value='No';
  }
}

document.getElementById('submitBtn').addEventListener('click', (e) => {
  e.preventDefault();

  const data = {
    travelType: travelType.value,
    purpose: purpose.value,
    fromDate: fromDate.value,
    toDate: toDate.value,
    totalDays: totalDays.value,
    status: 'Pending',
    plannedExpenses: {
      transport: +transport.value || 0,
      tada: +tada.value || 0,
      vehicle: +vehicle.value || 0,
      guest: +guest.value || 0,
      team: +team.value || 0,
      other: +other.value || 0
    },
    advanceTaken:
      advanceRequired.value === 'Yes'
        ? +advanceAmount.value || 0
        : 0
  };

  if (editingIndex !== null) {
    travelRequests[editingIndex] = data;
  } else {
    travelRequests.push(data);
  }

  localStorage.setItem('travelRequests', JSON.stringify(travelRequests));

  modal.style.display = 'none';   // ✅ FIXED
  editingIndex = null;
  render();
});

document.getElementById('addBtn').onclick=()=>openForm();

document.getElementById('closeBtn').onclick=()=>modal.style.display='none';

function render() {
  list.innerHTML = '';
  travelRequests.forEach((t,i)=>{
    const div = document.createElement('div');
    div.className = 'card';

    // Ensure plannedExpenses exists
    const expenses = t.plannedExpenses || { transport:0, tada:0, vehicle:0, guest:0, team:0, other:0 };
    const totalExpense = Object.values(expenses).reduce((a,b)=>a+b,0);

    div.innerHTML = `
      <h4>${t.travelType}</h4>
      <p>${t.fromDate} → ${t.toDate} (${t.totalDays} days)</p>
      <p>Total Expense: Rs ${totalExpense}</p>
      <span class="status-badge status-${t.status}">${t.status}</span>
    `;
    div.onclick = () => openForm(i);
    list.appendChild(div);
  });
}

render();
</script>

</body>
</html>
