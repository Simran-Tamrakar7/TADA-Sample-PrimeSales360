<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Expenses</title>
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:20px; }
h2,h3 { color:#333; }
label { display:block; margin:8px 0 3px; font-weight:bold; }
input,select { width:100%; padding:8px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc; }
button { padding:8px 15px; background:#4CAF50; color:#fff; border:none; border-radius:5px; cursor:pointer; }
button:disabled { background:#aaa; cursor:not-allowed; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th,td { border:1px solid #ccc; padding:8px; text-align:left; }
.deleteBtn { background:#f44336; }
.deleteBtn:hover { opacity:0.8; }
</style>
</head>
<body>

<div class="container">
  <h2>Add Travel Expense</h2>

  <section>
    <h3>Expense Details</h3>
    <label>Travel Reference</label>
    <input type="text" id="travelRef" placeholder="Auto-link from travel request">
    <label>Expense Type</label>
    <select id="expenseType">
      <option>Transport</option>
      <option>TADA</option>
      <option>Vehicle Rental/Fuel</option>
      <option>Guest & Entertainment</option>
      <option>Team Meeting</option>
      <option>Other</option>
    </select>
    <label>Amount</label>
    <input type="number" id="expenseAmount" placeholder="Enter amount">
    <label>Upload Receipt</label>
    <input type="file" id="receiptFile" multiple>
  </section>

  <button id="addExpenseBtn">Add Expense</button>

  <section>
    <h3>Expenses Added</h3>
    <table id="expenseTable">
      <thead>
        <tr>
          <th>Travel Ref</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Receipt</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</div>

<script>
// Elements
const addBtn = document.getElementById('addExpenseBtn');
const tableBody = document.querySelector('#expenseTable tbody');
const travelRefInput = document.getElementById('travelRef');
const expenseType = document.getElementById('expenseType');
const expenseAmount = document.getElementById('expenseAmount');
const receiptFile = document.getElementById('receiptFile');

// Load existing expenses from localStorage
let expenses = JSON.parse(localStorage.getItem('addedExpenses') || '[]');

// Render table
function renderTable(readOnly=false){
  tableBody.innerHTML = '';
  expenses.forEach((exp,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${exp.travelRef}</td>
      <td>${exp.type}</td>
      <td>${exp.amount}</td>
      <td>${exp.receiptName || '-'}</td>
      <td>${readOnly ? '-' : `<button data-index="${i}" class="deleteBtn">Delete</button>`}</td>
    `;
    tableBody.appendChild(tr);
  });

  if(!readOnly){
    document.querySelectorAll('.deleteBtn').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const idx = e.target.dataset.index;
        expenses.splice(idx,1);
        localStorage.setItem('addedExpenses', JSON.stringify(expenses));
        renderTable();
      });
    });
  }
}

// Add expense
addBtn.addEventListener('click', ()=>{
  const travelRef = travelRefInput.value.trim();
  const type = expenseType.value;
  const amount = parseFloat(expenseAmount.value) || 0;
  const receipt = receiptFile.files[0];

  if(!travelRef || amount<=0){
    alert('Please enter a valid travel reference and amount.');
    return;
  }

  expenses.push({
    travelRef,
    type,
    amount,
    receiptName: receipt ? receipt.name : '-'
  });

  localStorage.setItem('addedExpenses', JSON.stringify(expenses));
  renderTable();

  // Reset inputs
  expenseAmount.value = '';
  receiptFile.value = '';
});

// Initialize table
renderTable();
</script>

</body>
</html>
