<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Status</title>
<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; }
.container { width:95%; max-width:1200px; margin:30px auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1);}
h2{color:#333; margin-bottom:15px;}
.module-section { margin-bottom:30px; }
.module-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.module-header h3{margin:0;}
.counter { background:#4CAF50;color:#fff;border-radius:50%;padding:2px 7px;font-size:12px; }
.accordion { margin-bottom:10px; border-radius:6px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.accordion-header { background:#eee; padding:10px 15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-weight:bold; }
.accordion-body { max-height:0; overflow:hidden; transition:max-height 0.3s ease; background:#fafafa;}
.card { padding:10px 15px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center; }
.card:last-child{border-bottom:none;}
.card-info{display:flex; flex-direction:column;}
.card-info span{margin-bottom:3px;}
button{padding:6px 12px; border:none; border-radius:5px; cursor:pointer; font-size:14px;}
button.approve{background:#4CAF50; color:#fff;}
button.reject{background:#f44336; color:#fff;}
.status-pending{color:#FFA500;}
.status-approved{color:#4CAF50;}
.status-rejected{color:#f44336;}
</style>
</head>
<body>

<div class="container">
<h2>Approval Dashboard</h2>

<div id="approvalContent">
  <!-- All modules will be injected here dynamically -->
</div>

</div>

<script>
// ======= MODULE NAMES =======
const modules = ['Travel Requests', 'Expenses', 'Post-Travel Settlements', 'Advance Requests'];

// ======= FETCH DATA =======
function getModuleData(name){
  switch(name){
    case 'Travel Requests':
      const travel = JSON.parse(localStorage.getItem('travelRequests')||'[]');
      return travel.map(t => ({...t, status: t.status || 'Pending'}));
    case 'Expenses':
      const expenses = JSON.parse(localStorage.getItem('addedExpenses')||'[]');
      return expenses.map(e => ({...e, status: e.status || 'Pending'}));
    case 'Post-Travel Settlements':
      const settlements = JSON.parse(localStorage.getItem('postSettlements')||'[]');
      return settlements.map(s => ({...s, status: s.status || 'Pending'}));
    case 'Advance Requests':
      const advances = JSON.parse(localStorage.getItem('advanceRequests')||'[]');
      return advances.map(a => ({...a, status: a.status || 'Pending'}));
    default: return [];
  }
}

// ======= SAVE DATA =======
function saveModuleData(name, data){
  switch(name){
    case 'Travel Requests': localStorage.setItem('travelRequests', JSON.stringify(data)); break;
    case 'Expenses': localStorage.setItem('addedExpenses', JSON.stringify(data)); break;
    case 'Post-Travel Settlements': localStorage.setItem('postSettlements', JSON.stringify(data)); break;
    case 'Advance Requests': localStorage.setItem('advanceRequests', JSON.stringify(data)); break;
  }
}

// ======= RENDER MODULE =======
function renderModule(name){
  const data = getModuleData(name);
  const pending = data.filter(d=>d.status==='Pending');
  const approved = data.filter(d=>d.status==='Approved');
  const rejected = data.filter(d=>d.status==='Rejected');

  const renderAccordion = (title, arr, statusClass) => `
    <div class="accordion">
      <div class="accordion-header">${title} (${arr.length})</div>
      <div class="accordion-body">
        ${arr.map((item,i)=>`
          <div class="card">
            <div class="card-info">
              ${Object.entries(item).map(([k,v])=>`<span>${k}: <span class="status-${statusClass}">${v}</span></span>`).join('')}
            </div>
            <div class="card-actions">
              ${statusClass==='pending' ? `<button class="approve" data-module="${name}" data-index="${i}">Approve</button>
              <button class="reject" data-module="${name}" data-index="${i}">Reject</button>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  return `
    <div class="module-section">
      <div class="module-header">
        <h3>${name}</h3>
        <span class="counter">Total: ${data.length}</span>
      </div>
      ${renderAccordion('Pending', pending, 'pending')}
      ${renderAccordion('Approved', approved, 'approved')}
      ${renderAccordion('Rejected', rejected, 'rejected')}
    </div>
  `;
}

// ======= RENDER DASHBOARD =======
function renderDashboard(){
  const container = document.getElementById('approvalContent');
  container.innerHTML = modules.map(renderModule).join('');

  // Accordion toggle
  document.querySelectorAll('.accordion-header').forEach(accHeader=>{
    accHeader.addEventListener('click', ()=>{
      const body = accHeader.nextElementSibling;
      body.style.maxHeight = body.style.maxHeight && body.style.maxHeight!=='0px' ? '0px' : body.scrollHeight+'px';
    });
  });

  // Approve buttons
  document.querySelectorAll('.approve').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const moduleName = btn.dataset.module;
      const index = parseInt(btn.dataset.index);
      let data = getModuleData(moduleName);
      const pendingItems = data.filter(d=>d.status==='Pending');
      const item = pendingItems[index];
      if(item){
        item.status = 'Approved';
        saveModuleData(moduleName, data);
        renderDashboard();
      }
    });
  });

  // Reject buttons
  document.querySelectorAll('.reject').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const moduleName = btn.dataset.module;
      const index = parseInt(btn.dataset.index);
      let data = getModuleData(moduleName);
      const pendingItems = data.filter(d=>d.status==='Pending');
      const item = pendingItems[index];
      if(item){
        item.status = 'Rejected';
        saveModuleData(moduleName, data);
        renderDashboard();
      }
    });
  });
}

// ======= INITIAL RENDER =======
renderDashboard();
</script>

</body>
</html>
