<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Travel Expense</title>
<link rel="stylesheet" href="style.css">
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background: #eee; }
  button { padding: 6px 12px; border:none; border-radius:5px; cursor:pointer; margin-top:5px;}
  button.deleteBtn{background:#f44336; color:#fff;}
</style>
</head>
<body>
<div class="container">
  <h2>Add Travel Expense</h2>

  <!-- Expense Form -->
  <section>
    <h3>Expense Details</h3>
    <label>Travel Reference</label>
    <select id="travelRefSelect"></select>

    <label>Expense Type</label>
    <select id="expenseType">
      <option>Transport</option>
      <option>TADA</option>
      <option>Vehicle Rental/Fuel</option>
      <option>Guest & Entertainment</option>
      <option>Team Meeting</option>
      <option>Other</option>
    </select>

    <label>Amount</label>
    <input type="number" id="expenseAmount" placeholder="Enter amount">

    <label>Upload Receipt</label>
    <input type="file" id="receiptFile" multiple>

    <button id="addExpenseBtn">Add Expense</button>
  </section>

  <!-- Expenses Table -->
  <section>
    <h3>Expenses Added</h3>
    <table id="expenseTable">
      <thead>
        <tr>
          <th>Travel Reference</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Receipt</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</div>

<script>
const addBtn = document.getElementById('addExpenseBtn');
const expenseTableBody = document.querySelector('#expenseTable tbody');

// Load existing expenses from localStorage
let expenses = JSON.parse(localStorage.getItem('addedExpenses')||'[]');

function renderTable(){
  expenseTableBody.innerHTML = '';
  expenses.forEach((exp, i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${exp.travelRef}</td>
      <td>${exp.type}</td>
      <td>${exp.amount}</td>
      <td>${exp.receiptName || '-'}</td>
      <td><button class="deleteBtn" data-index="${i}">Delete</button></td>
    `;
    expenseTableBody.appendChild(tr);
  });

  document.querySelectorAll('.deleteBtn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const idx = e.target.dataset.index;
      expenses.splice(idx,1);
      localStorage.setItem('addedExpenses', JSON.stringify(expenses));
      renderTable();
    });
  });
}

// Populate Travel References dropdown
function populateTravelRefs(){
  const travelRefsSelect = document.getElementById('travelRefSelect');
  travelRefsSelect.innerHTML = '';

  // Example: logged-in employee name, replace with dynamic login if available
  const employeeName = 'Mohit';

  const travelRequests = JSON.parse(localStorage.getItem('travelRequests')||'[]')
                             .filter(t=>t.employeeName === employeeName);

  if(travelRequests.length === 0){
    const option = document.createElement('option');
    option.textContent = 'No travel requests found';
    option.value = '';
    travelRefsSelect.appendChild(option);
    travelRefsSelect.disabled = true;
  } else {
    travelRequests.forEach(t=>{
      const option = document.createElement('option');
      option.value = t.travelRef || `${t.fromDate}-${t.toDate}`;
      option.textContent = t.travelRef || `${t.travelType} (${t.fromDate} to ${t.toDate})`;
      travelRefsSelect.appendChild(option);
    });
    travelRefsSelect.disabled = false;
  }
}

// Add Expense
addBtn.addEventListener('click', ()=>{
  const travelRef = document.getElementById('travelRefSelect').value;
  const type = document.getElementById('expenseType').value;
  const amount = parseFloat(document.getElementById('expenseAmount').value)||0;
  const receipt = document.getElementById('receiptFile').files[0];

  if(!travelRef){
    alert('Select a travel reference first!');
    return;
  }

  expenses.push({travelRef, type, amount, receiptName: receipt?receipt.name:'-'});
  localStorage.setItem('addedExpenses', JSON.stringify(expenses));
  renderTable();

  // Reset inputs
  document.getElementById('expenseAmount').value = '';
  document.getElementById('receiptFile').value = '';
});

// Initialize
window.addEventListener('load', ()=>{
  populateTravelRefs();
  renderTable();
});
</script>
</body>
</html>
