<!DOCTYPE html>
<html>
<head>
  <title>Settlement</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Travel Settlement</h2>

<p>Planned Expenses (A): Rs <span id="planned">5000</span></p>
<p>Advance Received: Rs <span id="advance">3000</span></p>

<label>Actual Expenses (B)</label>
<input type="number" id="actual">

<h3>
Net Payable / (Receivable): Rs
<span id="net">0</span>
</h3>

<button>Submit Settlement</button>

<script>
const actual = document.getElementById("actual");
const planned = 5000;
const advance = 3000;

actual.addEventListener("input", () => {
  document.getElementById("net").innerText =
    actual.value - advance;
});
</script>

</body>
</html>
