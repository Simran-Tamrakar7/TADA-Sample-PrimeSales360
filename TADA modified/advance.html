<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advance Requests</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>Advance Requests</h2>

  <section>
    <h3>Request Advance</h3>
    <label>Travel Reference</label>
    <input type="text" id="travelRef" placeholder="Auto from last approved travel" readonly>
    <label>Amount Requested</label><input type="number" id="amountReq" placeholder="Rs">
    <label>Existing Advances</label><input type="number" id="existingAdv" value="0" readonly>
    <label>Overdue Settlements</label><input type="number" id="overdue" value="0" readonly>
    <label>Eligibility</label><input type="text" id="eligibility" readonly>
  </section>

  <button id="submitBtn" disabled>Submit Advance Request</button>
</div>

<script>
const travelRefInput = document.getElementById('travelRef');
const amountReq = document.getElementById('amountReq');
const existingAdv = document.getElementById('existingAdv');
const overdue = document.getElementById('overdue');
const eligibility = document.getElementById('eligibility');
const submitBtn = document.getElementById('submitBtn');

function loadLastApprovedTravel(){
  const requests = JSON.parse(localStorage.getItem('travelRequests')||'[]');
  const lastApproved = requests.filter(t=>t.status==='Approved').pop();
  if(lastApproved){
    travelRefInput.value = lastApproved.travelRef;
    existingAdv.value = lastApproved.advanceTaken || 0;
    overdue.value = 0;
    checkEligibility();
  } else {
    travelRefInput.value = 'No Approved Travel';
    submitBtn.disabled = true;
    eligibility.value = 'Not Eligible';
  }
}

function checkEligibility(){
  const ex = parseFloat(existingAdv.value)||0;
  const od = parseFloat(overdue.value)||0;
  if(ex===0 && od===0){
    eligibility.value = "Eligible";
    submitBtn.disabled = false;
  } else {
    eligibility.value = "Not Eligible";
    submitBtn.disabled = true;
  }
}

loadLastApprovedTravel();

submitBtn.addEventListener('click', ()=>{
  const travelRef = travelRefInput.value;
  const advances = JSON.parse(localStorage.getItem('advanceRequests')||'[]');
  advances.push({
    travelRef,
    amount: parseFloat(amountReq.value)||0,
    existingAdv: parseFloat(existingAdv.value)||0,
    overdue: parseFloat(overdue.value)||0,
    eligibility: eligibility.value,
    status:'Pending'
  });
  localStorage.setItem('advanceRequests', JSON.stringify(advances));

  // Update travel request advanceTaken
  const travelRequests = JSON.parse(localStorage.getItem('travelRequests')||'[]');
  const travel = travelRequests.find(t=>t.travelRef===travelRef);
  if(travel) travel.advanceTaken = parseFloat(amountReq.value)||0;
  localStorage.setItem('travelRequests', JSON.stringify(travelRequests));

  alert('Advance Request Submitted!');
  location.reload();
});
</script>
</body>
</html>
